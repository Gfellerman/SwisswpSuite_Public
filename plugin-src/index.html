<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwissSuite AI Admin</title>

  <!-- Fonts: preconnect for performance, then full variable font load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- App styles (Tailwind v4 + shadcn/ui theme) -->
  <link rel="stylesheet" href="/src/index.css">

  <!-- Custom scrollbar -->
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body>
  <div id="swisswpsuite-app-root"></div>

  <script>
    // Placeholder bootstrap payload for `npm run dev` only. WordPress
    // supplies the real object via wp_localize_script; this branch never
    // runs inside wp-admin.
    if (!window.swisswpsuiteData) {
      window.swisswpsuiteData = {
        root: 'http://localhost:3000/wp-json/',
        homeUrl: 'http://localhost:3000',
        nonce: 'dev-nonce',
        apiUrl: 'http://localhost:3000/wp-json/swisswpsuite/v1',
        version: '0.0.0-dev',
        isStandalone: false,
        hasWooCommerce: false,
        adminEmail: 'dev@example.com'
      };
    }
  </script>

  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
